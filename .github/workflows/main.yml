name: Paramedical Result Scraper

on:
  schedule:
    - cron: '*/5 * * * *'  # हर 5 मिनट में ऑटोमैटिक चलेगा
  workflow_dispatch:      # आप मैन्युअल रूप से 'Run workflow' बटन से भी चला सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: |
        python scraper.py

    - name: Save Updated History
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-update scraped results history [skip ci]"
        branch: main
